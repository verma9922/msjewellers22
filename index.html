<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>M.S. Jewellers</title>
<link rel="icon" type="image/png" href="logo.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#d4af37">
<meta name="google-site-verification" content="Zgz_tCwIN8ebthwj6M8hb6dxmxGbfOO1Qxk-nH5rJNU" />

<style>
body {
  margin:0;
  font-family: 'Poppins', Arial, sans-serif;
  background:#000;
  color:#fff;
}
header{
  background:linear-gradient(to right,#b8860b,#ffd700);
  padding:25px;
  text-align:center;
  color:#000;
}
header h1{margin:0; font-size:40px;}
header p{font-size:18px;}
.call-btn{
  position:fixed; bottom:20px; right:20px; background:#000; color:#fff;
  padding:15px 25px; border-radius:50px; text-decoration:none; font-weight:bold;
}
#filterMenu{text-align:center; padding:20px;}
#filterMenu button{
  margin:5px; padding:10px 15px; border:none;
  background:#b8860b; color:#fff; border-radius:5px;
  cursor:pointer; font-weight:bold;
}
#filterMenu button:hover{background:#ffd700; color:#000;}
section.products{
  padding:20px; max-width:1200px; margin:auto; display:flex; flex-wrap:wrap; justify-content:center; gap:15px;
}
.products .product{width:260px;}
.products img{
  width:100%; height:260px; object-fit:cover; border-radius:15px; box-shadow:0 8px 20px rgba(0,0,0,0.2); cursor:pointer;
}
section, footer{padding:20px;}
footer{text-align:center; color:#fff; background:#000;}
</style>
</head>

<body>
<header>
<h1>M.S. Jewellers</h1>
<p>Pure Gold • Diamond • Silver Jewellery</p>
</header>

<a href="tel:9466218122" class="call-btn">📞 Call Now</a>

<section id="filterMenu">
<h2>Categories</h2>
<button onclick="filterCategory('all')">Show All</button>
<button onclick="filterCategory('gents-ring')">Gents Rings</button>
<button onclick="filterCategory('ladies-ring')">Ladies Rings</button>
<button onclick="filterCategory('necklace')">Necklaces</button>
<button onclick="filterCategory('tops')">Tops</button>
<button onclick="filterCategory('gents-kada')">Gents Kada</button>
<button onclick="filterCategory('bangles')">Bangles</button>
<button onclick="filterCategory('chains')">Chains</button>
<button onclick="filterCategory('gents-murki')">Gents Murki</button>
<button onclick="filterCategory('ring-pairs')">Ring Ceremony Pairs</button>
</section>

<section class="products">
  <!-- GENTS RINGS -->
  <div class="product" data-category="gents-ring"><img src="images/jewel12.jpg" alt="Gents Ring"></div>
  
  <!-- LADIES RINGS -->
  <div class="product" data-category="ladies-ring"><img src="images/jewel17.jpg" alt="Ladies Ring"></div>
  <div class="product" data-category="ladies-ring"><img src="images/ring1.jpg" alt="Ladies Ring"></div>
  <div class="product" data-category="ladies-ring"><img src="images/ring2.jpg" alt="Ladies Ring"></div>
  <div class="product" data-category="ladies-ring"><img src="images/ring3.jpg" alt="Ladies Ring"></div>

  <!-- NECKLACES -->
  <div class="product" data-category="necklace"><img src="images/jewel1.jpg" alt="Necklace"></div>
  <div class="product" data-category="necklace"><img src="images/jewel3.jpg" alt="Necklace"></div>
  <div class="product" data-category="necklace"><img src="images/jewel4.jpg" alt="Necklace"></div>

  <!-- TOPS -->
  <div class="product" data-category="tops"><img src="images/jewel2.jpg" alt="Tops"></div>
  <div class="product" data-category="tops"><img src="images/jewel5.jpg" alt="Tops"></div>

  <!-- GENTS KADA -->
  <div class="product" data-category="gents-kada"><img src="images/jewel13.jpg" alt="Gents Kada"></div>
  <div class="product" data-category="gents-kada"><img src="images/jewel14.jpg" alt="Gents Kada"></div>

  <!-- BANGLES -->
  <div class="product" data-category="bangles"><img src="images/jewel15.jpg" alt="Bangles"></div>

  <!-- CHAINS -->
  <div class="product" data-category="chains"><img src="images/jewel16.jpg" alt="Chains"></div>

  <!-- GENTS MURKI -->
  <div class="product" data-category="gents-murki"><img src="images/jewel6.jpg" alt="Gents Murki"></div>
  <div class="product" data-category="gents-murki"><img src="images/jewel9.jpg" alt="Gents Murki"></div>
  <div class="product" data-category="gents-murki"><img src="images/jewel10.jpg" alt="Gents Murki"></div>

  <!-- RING CEREMONY PAIRS -->
  <div class="product" data-category="ring-pairs"><img src="images/jewel11.jpg" alt="Ring Pairs"></div>
</section>

<!-- Image Viewer -->
<div id="imgViewer" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.9);justify-content:center;align-items:center;z-index:9999;">
  <img id="fullImg" style="max-width:90%;max-height:90%;">
</div>

<script>
function filterCategory(cat){
  const items = document.querySelectorAll('.product');
  items.forEach(item=>{
    item.style.display = (cat==='all'||item.dataset.category===cat)?'block':'none';
  });
}

// Image viewer
let viewer = document.getElementById("imgViewer");
let fullImg = document.getElementById("fullImg");
document.querySelectorAll('.products img').forEach(img=>{
  img.onclick=function(){
    viewer.style.display='flex';
    fullImg.src=this.src;
  }
});
viewer.onclick=function(){viewer.style.display='none';};
</script>

<footer>
<p>© 2026 M.S. Jewellers | All Rights Reserved</p>
<p>Business Handle: msjewellers22</p>
</footer>

</body>
</html>
